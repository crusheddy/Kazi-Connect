name: Build Android APK

on:
  push:
    paths:
      - 'android-app/**'
      - 'site/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle and sync to Android
        run: npm run sync

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android-app/android

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/kazi-connect-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kazi-connect-apk
          path: android-app/out/*.apk
          if-no-files-found: error
